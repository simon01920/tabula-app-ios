# App Preview capture: real screen-recorded video of the real Tabula simulator build driven by real taps (XCUITest
# target TabulaPreviewCapture, PreviewCapture/Sources). Capture only: nothing here builds for release, signs with an
# Apple account or uploads anywhere but this run's artifact. Per shot: erase + boot the simulator, fixed status bar
# (10:20 = the seed clock), light appearance, Large text, `simctl io recordVideo` around ONE test
# (`test-without-building -only-testing`), SIGINT to finalise the mp4, ffprobe/ffmpeg decode check, 3 keyframes,
# manifest JSON. docs/ENVIRONMENT.md §40.
name: App Preview capture (iOS Simulator video)

on:
  push:
    branches: [video/app-preview]
    paths:
      - ".github/workflows/app-preview-capture.yml"
      - "PreviewCapture/**"
      - "project.yml"
      - "App/**"
      - "Packages/TimetableUI/Sources/**"
      - "video/assets/**"
  workflow_dispatch:
    inputs:
      shots:
        description: "Space-separated shots (test_<shot> methods): S1_today_to_week S2_photo_import S2b_photo_import_flat S3_lesson_homework S4_exam S5_reminders S6_widgets_live S7_watch S8a_day S8b_tiles"
        type: string
        default: ""
      seed:
        description: "-TabulaSeed for the seeded shots"
        type: string
        default: ""
      import_image:
        description: "Image in video/assets/ added to Photos for S2"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: app-preview-capture-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_APP: /Applications/Xcode_27.app
  XCODEGEN_VERSION: "2.46.0"
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
  # All shots: S1_today_to_week S8a_day S8b_tiles S3_lesson_homework S4_exam S5_reminders S2_photo_import
  # S2b_photo_import_flat S6_widgets_live S7_watch (~5 min each incl. erase/boot/install: all + the build exceed 60 min,
  # run 41748424916). Push default = the shots still being worked on; S1/S4/S5/S8 are in run 41748424916.
  SHOTS: ${{ inputs.shots || 'S2_photo_import S2b_photo_import_flat S3_lesson_homework S6_widgets_live' }}
  SEED: ${{ inputs.seed || 'preview' }}
  IMPORT_IMAGE: ${{ inputs.import_image || 'import-source.png' }}
  OUT: video-out

jobs:
  capture:
    name: Record App Preview clips
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode, check recordVideo options, ffmpeg
        run: |
          set -eo pipefail
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version | tee xcode-version.txt
          xcrun simctl help io > simctl-io-help.txt 2>&1 || true   # `help` exits non-zero (run 41747128681)
          grep -A12 'recordVideo \[' simctl-io-help.txt || true
          grep -q -- '--codec' simctl-io-help.txt && grep -q -- '--force' simctl-io-help.txt \
            || { echo "::error::simctl io recordVideo lacks --codec/--force on this Xcode"; exit 1; }
          command -v ffprobe >/dev/null || brew install ffmpeg
          ffprobe -version | head -1

      - name: Install XcodeGen (pinned + SHA-256)
        run: |
          curl -fsSL -o xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip"
          echo "${XCODEGEN_SHA256}  xcodegen.zip" | shasum -a 256 -c -
          unzip -q xcodegen.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate project
        run: xcodegen generate --spec project.yml

      - name: Pick + create simulators (largest Pro Max, newest iOS; watch for S7)
        run: |
          set -eo pipefail
          xcrun simctl list -j > "$RUNNER_TEMP/simctl.json"
          python3 scripts/sim_pick.py "$RUNNER_TEMP/simctl.json" --platform iOS > "$RUNNER_TEMP/pick.env"
          python3 scripts/sim_pick.py "$RUNNER_TEMP/simctl.json" --platform watchOS > "$RUNNER_TEMP/watch.env" || true
          cat "$RUNNER_TEMP/pick.env" "$RUNNER_TEMP/watch.env" | tee -a "$GITHUB_ENV"
          SIM_TYPE="$(sed -n 's/^SIM_TYPE=//p' "$RUNNER_TEMP/pick.env")"
          SIM_RUNTIME="$(sed -n 's/^SIM_RUNTIME=//p' "$RUNNER_TEMP/pick.env")"
          echo "SIM_UDID=$(xcrun simctl create "Tabula Preview" "$SIM_TYPE" "$SIM_RUNTIME")" | tee -a "$GITHUB_ENV"

      - name: Build for testing once (ad-hoc simulator signing, entitlements embedded; fallback unsigned)
        run: |
          set -o pipefail
          mkdir -p build "$OUT"
          common=(-project Tabula.xcodeproj -scheme TabulaPreviewCapture -configuration Debug
                  -destination "platform=iOS Simulator,id=$SIM_UDID" -derivedDataPath build/DD)
          if xcodebuild build-for-testing "${common[@]}" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
               PROVISIONING_PROFILE_SPECIFIER= 2>&1 | tee build/build-for-testing.log | xcbeautify --renderer github-actions; then
            echo "SIGNING=adhoc" >> "$GITHUB_ENV"
          else
            echo "::warning::ad-hoc signed build failed; rebuilding with CODE_SIGNING_ALLOWED=NO (no App Group in the app)"
            xcodebuild build-for-testing "${common[@]}" CODE_SIGNING_ALLOWED=NO 2>&1 \
              | tee build/build-for-testing-unsigned.log | xcbeautify --renderer github-actions
            echo "SIGNING=unsigned" >> "$GITHUB_ENV"
          fi
          APP="build/DD/Build/Products/Debug-iphonesimulator/TabulaApp.app"
          XCTESTRUN="$(ls build/DD/Build/Products/*.xctestrun | head -1)"
          [ -d "$APP" ] && [ -f "$XCTESTRUN" ] || { echo "::error::app or xctestrun missing"; exit 1; }
          { echo "APP=$APP"; echo "XCTESTRUN=$XCTESTRUN"
            echo "BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"; } >> "$GITHUB_ENV"
          { echo "## app"; codesign -d --entitlements - "$APP" 2>&1
            echo "## widget"; codesign -d --entitlements - "$APP/PlugIns/TabulaWidgets.appex" 2>&1
            echo "## watch"; codesign -d --entitlements - "$APP/Watch/TabulaWatch.app" 2>&1
            # Simulator builds carry entitlements in the __TEXT,__entitlements section (linker -sectcreate), not in the
            # signature, so codesign prints an empty [Dict]; these are the embedded files (run 41747334469).
            for x in build/DD/Build/Intermediates.noindex/Tabula.build/Debug-*simulator/*.build/*-Simulated.xcent; do
              echo "## $x"; cat "$x"; done; } | tee "$OUT/entitlements.txt" || true

      - name: Record shots
        env:
          TEST_RUNNER_TABULA_SEED: ${{ inputs.seed || 'preview' }}
        run: |
          set +e -uo pipefail   # the default shell is `bash -e`: one failed shot must not stop the others
          SHA="$(git rev-parse HEAD)"; RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          XCODE="$(head -1 xcode-version.txt) ($(sed -n 2p xcode-version.txt))"

          prep() { # prep <udid>: erased, booted, deterministic look
            xcrun simctl shutdown "$1" >/dev/null 2>&1 || true
            xcrun simctl erase "$1"
            xcrun simctl boot "$1"; xcrun simctl bootstatus "$1" -b >/dev/null
            # The first keyboard shows a "slide to type" intro sheet over everything (run 41748424916, S6).
            xcrun simctl spawn "$1" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true || true
            sleep 5
          }
          look() { # look <iphone udid>
            xcrun simctl status_bar "$1" override --time "10:20" --dataNetwork wifi --wifiMode active --wifiBars 3 \
              --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100 || true
            xcrun simctl ui "$1" appearance light
            xcrun simctl ui "$1" content_size large || true
          }
          rec_start() { # rec_start <udid> <mp4>  -> REC_PID
            xcrun simctl io "$1" recordVideo --codec=h264 --force "$2" 2> "$2.log" &
            REC_PID=$!
            for _ in $(seq 1 40); do
              grep -q "Recording started" "$2.log" 2>/dev/null && { REC_T0="$(python3 -c 'import time; print(time.time())')"; return 0; }
              sleep 0.5
            done
            REC_T0="$(python3 -c 'import time; print(time.time())')"
            echo "::warning::no 'Recording started' for $2"; cat "$2.log"
          }
          rec_stop() { # rec_stop <pid>: SIGINT finalises the file
            kill -INT "$1" 2>/dev/null; wait "$1" 2>/dev/null || true
          }
          check_clip() { # check_clip <mp4> <keyframe dir> [offset s] -> prints ffprobe line; 1 if empty/undecodable
            local f="$1" kd="$2" off="${3:-0}" dur
            [ -s "$f" ] || { echo "EMPTY"; return 1; }
            ffmpeg -v error -i "$f" -f null - > "$f.decode.txt" 2>&1 || { echo "UNDECODABLE"; return 1; }
            # recordVideo writes variable-frame-rate h264; the null muxer's "non monotonically increasing dts" lines are
            # not decode errors (run 41747334469). Anything else is.
            if grep -v -e "non monotonically increasing dts" -e "Last message repeated" "$f.decode.txt" | grep -q .; then
              echo "DECODE ERRORS: $(grep -v -e 'non monotonically' -e 'Last message' "$f.decode.txt" | head -3)"; return 1
            fi
            dur="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$f")"
            mkdir -p "$kd"
            # Keyframes over the test's part of the clip (offset = test start; before it: install + runner launch).
            for pct in 15 50 85; do
              ffmpeg -v error -y -ss "$(python3 -c "print($off + ($dur - $off) * $pct / 100)")" -i "$f" -frames:v 1 -vf scale=660:-2 \
                "$kd/$(basename "$f" .mp4)-$pct.png"
            done
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,avg_frame_rate,nb_frames:format=duration \
              -of compact=p=0 "$f" | tr '\n' ' '
          }
          manifest() { # manifest <dir> <shot> <udid/device> <launch> <start> <end> <test rc> <clip check> <ffprobe>
            python3 - "$@" <<'PY'
          import json, os, sys
          d, shot, device, launch, start, end, rc, clip, probe = sys.argv[1:10]
          json.dump({"shot": shot, "test": f"test_{shot}", "test_exit": int(rc), "clip_ok": clip == "0", "ffprobe": probe,
                     "git_sha": os.environ["SHA"], "run_url": os.environ["RUN_URL"], "xcode": os.environ["XCODE"],
                     "runtime": os.environ.get("SIM_RUNTIME_NAME"), "device": device, "signing": os.environ.get("SIGNING"),
                     "seed": os.environ.get("SEED"), "locale": "en_GB", "languages": "(en)", "launch": launch,
                     "start_utc": start, "end_utc": end, "test_start_offset_s": float(os.environ.get("TEST_OFFSET") or 0)},
                    open(os.path.join(d, "manifest.json"), "w"), indent=2)
          PY
          }
          export SHA RUN_URL XCODE

          failed=0
          for shot in $SHOTS; do
            echo "::group::$shot"
            dir="$OUT/$shot"; mkdir -p "$dir"
            launch="-TabulaSeed $SEED -AppleLanguages (en) -AppleLocale en_GB"
            case "$shot" in
              S2_*|S2b_*) launch="-TabulaSeed previewBlank -AppleLanguages (en) -AppleLocale en_GB" ;;
              S6_*|S7_*) launch="(real store, no seed) -AppleLanguages (en) -AppleLocale en_GB" ;;
              S8a_*) launch="$launch -TabulaScreen timetable.day" ;;
              S8b_*) launch="$launch -TabulaScreen timetable.tiles" ;;
            esac
            phone="$SIM_UDID"; device="$SIM_NAME"; WUDID=""
            if [[ "$shot" == S7_* ]]; then
              phone="$(xcrun simctl create "Tabula Paired" "$SIM_TYPE" "$SIM_RUNTIME")"
              WUDID="$(xcrun simctl create "Tabula Watch" "$WATCH_TYPE" "$WATCH_RUNTIME")"
              xcrun simctl pair "$WUDID" "$phone" | tee "$dir/pair.txt"
              device="$SIM_NAME + $WATCH_NAME ($WATCH_RUNTIME_NAME)"
              prep "$WUDID"
            fi
            prep "$phone"; look "$phone"
            [[ "$shot" == S2_* ]] && xcrun simctl addmedia "$phone" "video/assets/$IMPORT_IMAGE"
            [[ "$shot" == S2b_* ]] && xcrun simctl addmedia "$phone" "video/assets/import-source-flat.png"
            if [ -n "$WUDID" ]; then
              xcrun simctl install "$WUDID" "$APP/Watch/TabulaWatch.app"
              WBUNDLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Watch/TabulaWatch.app/Info.plist")"
              xcrun simctl launch "$WUDID" "$WBUNDLE" || true
              rec_start "$WUDID" "$dir/$shot-watch.mp4"; WREC=$REC_PID
            fi
            start="$(date -u +%FT%TZ)"
            rec_start "$phone" "$dir/$shot.mp4"; PREC=$REC_PID; PHONE_T0=$REC_T0
            xcodebuild test-without-building -xctestrun "$XCTESTRUN" -destination "platform=iOS Simulator,id=$phone" \
              -only-testing "TabulaPreviewCapture/PreviewCaptureTests/test_$shot" -resultBundlePath "$dir/$shot.xcresult" \
              > "$dir/xcodebuild.log" 2>&1
            rc=$?
            if [ -n "$WUDID" ]; then
              xcrun simctl launch "$WUDID" "$WBUNDLE" || true   # bring it to the front again after the phone run
              sleep 20
              xcrun simctl io "$WUDID" screenshot "$dir/$shot-watch.png" || true
            fi
            sleep 1
            rec_stop "$PREC"; [ -n "$WUDID" ] && rec_stop "$WREC"
            end="$(date -u +%FT%TZ)"
            # Seconds into the clip where the test started ("Selected tests' started at <local time>" in the log).
            export TEST_OFFSET="$(python3 - "$dir/xcodebuild.log" "$PHONE_T0" <<'PY'
          import re, sys, time
          m = re.search(r"Selected tests' started at (\d{4}-\d\d-\d\d \d\d:\d\d:\d\d)(\.\d+)?", open(sys.argv[1]).read())
          print(round(max(0.0, time.mktime(time.strptime(m[1], "%Y-%m-%d %H:%M:%S")) + float(m[2] or 0) - float(sys.argv[2])), 1)
                if m else 0)
          PY
          )"
            probe="$(check_clip "$dir/$shot.mp4" "$dir/keyframes" "$TEST_OFFSET")"; clip=$?
            [ -n "$WUDID" ] && { echo "watch: $(check_clip "$dir/$shot-watch.mp4" "$dir/keyframes")" | tee "$dir/watch-ffprobe.txt"; }
            manifest "$dir" "$shot" "$device" "$launch" "$start" "$end" "$rc" "$clip" "$probe"
            xcrun xcresulttool get test-results summary --path "$dir/$shot.xcresult" --compact > "$dir/xcresult-summary.json" 2>&1 || true
            grep -E "error:|failed|passed|HIERARCHY|PICKER|S3:|LAUNCH" "$dir/xcodebuild.log" | head -40 || true
            rm -rf "$dir/$shot.xcresult"   # summary + full log kept; the bundle is large
            echo "$shot: test rc=$rc clip=$clip $probe" | tee -a "$OUT/summary.txt"
            [ "$rc" -eq 0 ] && [ "$clip" -eq 0 ] || failed=1
            [ -n "$WUDID" ] && { xcrun simctl shutdown "$WUDID" "$phone" || true; }
            echo "::endgroup::"
          done
          cat "$OUT/summary.txt" >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: app-preview-${{ github.run_number }}
          path: |
            video-out/
            build/build-for-testing*.log
            simctl-io-help.txt
          if-no-files-found: warn
          retention-days: 14
