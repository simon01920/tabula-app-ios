# XcodeGen spec — the CI (macOS runner) build path: xcodebuild build / archive / TestFlight.
# Builds the SAME sources and packages as the local xtool path (Package.swift + xtool.yml), plus the watchOS app.
#   App/Sources              <-> Package.swift target TabulaApp      (path: App/Sources)
#   WidgetExtension/Sources  <-> Package.swift target TabulaWidgets  (path: WidgetExtension/Sources)
#   Packages/TimetableCore, Packages/TimetableUI <-> same local packages
#   Config/*.plist, Config/*.entitlements, Resources/Localizable.xcstrings <-> same files
# Differences by design (documented in docs/ENVIRONMENT.md): watch app (CI only), asset catalog icon
# (xtool uses Resources/AppIcon.png), Xcode compiles Localizable.xcstrings itself (xtool path uses
# scripts/l10n-compile.py), versions come from MARKETING_VERSION/CURRENT_PROJECT_VERSION.
# Validate locally (Linux): bash scripts/validate.sh   (runs `xcodegen generate` if available)
name: Tabula

options:
  bundleIdPrefix: sk.simondev
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top
  # Languages: the 12 launch languages live in Resources/Localizable.xcstrings (ids en sk cs pl hu ro de fr uk sr
  # sr-Latn ja zh-Hans; sr = Serbian Cyrillic). XcodeGen 2.46 has NO knownRegions option (verified 2026-10-10: a
  # `knownRegions:` key is ignored, pbxproj keeps Base+en) and Xcode compiles every language of the catalog anyway
  # (CI run 37449454629 emitted sk.lproj with this project). The languages are declared to iOS by CFBundleLocalizations
  # in Config/App-Info.plist + Config/Widgets-Info.plist; validate_config.py keeps those, the catalog and xtool.yml's
  # .lproj resources identical.

# Identity values + the paid-account switch live in ONE file (see its header). Project-level base configuration,
# so every target can use $(TABULA_BUNDLE_ID), $(TABULA_APP_ENTITLEMENTS), … . Do NOT redefine TABULA_* below:
# buildSettings here would override the xcconfig. CI overrides TABULA_DEVELOPMENT_TEAM / TABULA_PAID_ACCOUNT on
# the xcodebuild command line (highest precedence).
configFiles:
  Debug: Config/AppIdentity.xcconfig
  Release: Config/AppIdentity.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"          # CI release job overrides with the run number
    # No secrets here. $(…) is an Xcode build-setting reference (resolved at build time from
    # Config/AppIdentity.xcconfig, empty placeholder until the paid account exists), NOT XcodeGen's ${ENV}
    # expansion, so `xcodegen generate` no longer needs any environment variable. The CI release job passes
    # TABULA_DEVELOPMENT_TEAM=<vars.APPLE_TEAM_ID>; unsigned builds pass CODE_SIGNING_ALLOWED=NO.
    DEVELOPMENT_TEAM: $(TABULA_DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES          # Xcode adds bundle keys; Config/*.plist holds the shared extra keys
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  TimetableCore:
    path: Packages/TimetableCore
  TimetableUI:
    path: Packages/TimetableUI

targets:
  TabulaApp:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      # Localised Info.plist strings (display name + usage descriptions): Xcode compiles it into
      # <lang>.lproj/InfoPlist.strings; the xtool path generates the same files with scripts/infoplist-strings.py.
      - path: Resources/InfoPlist.xcstrings
        buildPhase: resources
      # App Shortcut phrases in 12 languages (Phase 4 B3): the String Catalog must be called "AppShortcuts" and belong
      # to the app target; Xcode's App Intents metadata step reads it. App target only (the shortcuts are the app's).
      - path: Resources/AppShortcuts.xcstrings
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Config/Privacy/App/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: TabulaApp             # bundle TabulaApp.app, same as xtool; display name "Tabula" from plist
        PRODUCT_MODULE_NAME: TabulaApp      # same module name as the SwiftPM target on the xtool path
        PRODUCT_BUNDLE_IDENTIFIER: $(TABULA_BUNDLE_ID)         # = xtool.yml bundleID (validate.sh)
        INFOPLIST_FILE: Config/App-Info.plist
        # Background App Refresh (Phase 3 reminders): UIBackgroundModes [fetch] + BGTaskSchedulerPermittedIdentifiers live
        # in Config/App-Info.plist (shared with xtool). Xcode's "Background Modes" capability only writes that plist key;
        # no entitlement is involved, so nothing else is needed here (validate_config.py checks the keys).
        # Config/Tabula.entitlements (App Group only, shared with xtool) unless TABULA_PAID_ACCOUNT = 1, then
        # Config/Entitlements/PaidAccount/Tabula.entitlements. Selection logic: Config/AppIdentity.xcconfig.
        CODE_SIGN_ENTITLEMENTS: $(TABULA_APP_ENTITLEMENTS)
        TARGETED_DEVICE_FAMILY: "1"         # iPhone only for v1 (iPad is a stretch goal, PRODUCT.md)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # CI always builds the macro-probe variant (Xcode ships Apple's macro plugins). The local xtool
        # default is the macro-free base variant (Package.swift, CLAUDE.md rule 5).
        # TABULA_APP_INTENTS (Phase 4 B3): Xcode generates Metadata.appintents, so this path compiles the intent-driven
        # controls (loud-alarm "Done"); xtool cannot (RISKS #19) and keeps the fallbacks (Package.swift).
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) TABULA_MACRO_PROBES TABULA_APP_INTENTS"
    dependencies:
      - package: TimetableCore
      - package: TimetableUI
      - target: TabulaWidgets               # app-extension => "Embed Foundation Extensions" (PlugIns/)
      - target: TabulaWatch                 # watchOS app   => "Embed Watch Content" ($(CONTENTS_FOLDER_PATH)/Watch)

  TabulaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: WidgetExtension/Sources
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Config/Privacy/Widgets/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: TabulaWidgets
        PRODUCT_MODULE_NAME: TabulaWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(TABULA_BUNDLE_ID).TabulaWidgets   # identical to xtool's derived ID
        INFOPLIST_FILE: Config/Widgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: $(TABULA_WIDGET_ENTITLEMENTS)          # same switch as the app
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        # Phase 4 B3: Homework checkbox (Button(intent:)) + configurable Now & Next / Today (AppIntentConfiguration);
        # needs this target's Metadata.appintents, which Xcode generates (not xtool: Package.swift keeps them off).
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) TABULA_APP_INTENTS"
    dependencies:
      - package: TimetableCore
      - package: TimetableUI

  TabulaWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp/Sources
      - path: WatchApp/Shared               # snapshot cache, shared with TabulaWatchWidgets (Phase 5 W1)
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Config/Privacy/Watch/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: TabulaWatch
        PRODUCT_MODULE_NAME: TabulaWatch
        PRODUCT_BUNDLE_IDENTIFIER: $(TABULA_BUNDLE_ID).watchkitapp
        INFOPLIST_FILE: Config/Watch-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/TabulaWatch.entitlements   # App Group (the complications read the cache)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES                   # embedded in the iOS app; must not be installed separately in archives
        # Do NOT set ARCHS here. Apple Watch Series 7 (S7) is arm64_32. In swift-build's watchOSDevice.xcspec,
        # ARCHS_STANDARD = (arm64, arm64_32) and arm64_32 has DeploymentTargetRange ("0", "27"), so it is
        # only built while WATCHOS_DEPLOYMENT_TARGET stays <= 27; keep it at 26.x. CI checks `lipo -archs`.
    dependencies:
      - package: TimetableCore
      - package: TimetableUI
      - target: TabulaWatchWidgets          # watchOS app-extension => embedded in TabulaWatch.app/PlugIns

  # Watch complications + Smart Stack (Phase 5 W1). CI path only, like the watch app (RISKS #1).
  TabulaWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchApp/Complications
      - path: WatchApp/Shared
      - path: Resources/Localizable.xcstrings
        buildPhase: resources
      - path: Config/Privacy/Watch/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: TabulaWatchWidgets
        PRODUCT_MODULE_NAME: TabulaWatchWidgets
        PRODUCT_BUNDLE_IDENTIFIER: $(TABULA_BUNDLE_ID).watchkitapp.widgets
        INFOPLIST_FILE: Config/WatchWidgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: Config/TabulaWatch.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: TimetableCore
      - package: TimetableUI

schemes:
  TabulaApp:
    build:
      targets:
        TabulaApp: all
    run:
      config: Debug
    archive:
      config: Release
